[project]
name = "taskhub-api"
version = "0.8.0"
description = "TaskHub — FastAPI Layered Architecture Sample Application"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B009", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic", "\\.venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
