services:
  db:
    image: postgres:16-alpine
    container_name: taskhub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: taskhub_password
      POSTGRES_DB: taskhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub -d taskhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskhub_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: sqlite+aiosqlite:///./app.db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: taskhub-production-secret-key-2026
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:

